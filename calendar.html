<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Calendar</title>
<link rel="stylesheet" href="calendar.css">
<style>
body { margin: 0; background: #f5f6fa; color: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button, .btn {
  padding: 5px 13px; border: 1px solid #d1d5db; border-radius: 999px;
  background: #f9fafb; color: #374151; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
}
.tabs button.active { background: #2a3f5f; border-color: #2a3f5f; color: #fff; }
.sheet { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.msg { font-size: 14px; color: #4b5563; }
.msg.err { color: #991b1b; }
.btn:disabled { opacity: .6; cursor: default; }
@media print {
  body { background: #fff; }
  .wrap { max-width: none; padding: 0; }
  .bar, #pngViewer { display: none !important; }
  .sheet { box-shadow: none; padding: 0; border-radius: 0; }
  .rc-scroll { overflow: visible; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div style="display:flex;gap:8px;">
      <a class="btn" href="index.html">← Briefing</a>
      <button class="btn" type="button" id="pngBtn" onclick="downloadPng()">Download PNG</button>
      <button class="btn" type="button" onclick="window.print()">Print / Save PDF</button>
    </div>
  </div>
  <div class="sheet"><div class="rc-scroll" id="calendar"><div class="msg">Loading roster…</div></div></div>
</div>

<div id="pngViewer" style="display:none;position:fixed;inset:0;z-index:10;background:rgba(17,24,39,.85);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;">
  <img alt="Roster calendar" style="max-width:100%;max-height:75vh;border-radius:6px;background:#fff;">
  <div style="color:#e5e7eb;font-size:13px;text-align:center;max-width:520px;line-height:1.5;">Tap Save / Share, or long-press the image to save it.<br>Sending on Telegram? Send it as a <b>File</b> (or switch on <b>HD</b>) to keep full quality — normal photos are compressed.</div>
  <div style="display:flex;gap:8px;">
    <button class="btn" type="button" id="pngShare">Save / Share</button>
    <button class="btn" type="button" id="pngClose">Close</button>
  </div>
</div>

<script src="calendar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const SUPABASE_FN = 'https://juohlwflvehlctiutrcu.supabase.co/functions/v1';
let roster = null, current = null;

// Same passcode the briefing page saves (view passcode, or the upload secret).
function getPasscode() {
  try { return localStorage.getItem('ftl_view_secret') || localStorage.getItem('ftl_upload_secret') || ''; }
  catch (_) { return ''; }
}

function show(key) {
  current = key;
  document.getElementById('tabs').innerHTML = RosterCalendar.monthKeys(roster).map(k => {
    const label = new Date(`${k}-01T00:00:00Z`).toLocaleString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' });
    return `<button type="button" class="${k === key ? 'active' : ''}" onclick="show('${k}')">${label}</button>`;
  }).join('');
  document.getElementById('calendar').innerHTML = RosterCalendar.render(roster, key);
  document.title = `Roster Calendar — ${key}`;
}

// Render the selected month off-screen at a fixed desktop width, so the image has
// the same layout on a phone as on a computer, then share or download it.
// 1280 CSS px at 2x = 2560px: Telegram's HD limit, so HD sends are not resized.
const PNG_WIDTH = 1280;
async function downloadPng() {
  if (!roster || !current || !window.html2canvas) return;
  const btn = document.getElementById('pngBtn');
  btn.disabled = true;
  btn.textContent = 'Rendering…';
  const stage = document.createElement('div');
  stage.style.cssText = `position:fixed;left:-${PNG_WIDTH * 2}px;top:0;width:${PNG_WIDTH}px;box-sizing:border-box;padding:20px;background:#fff;`;
  stage.innerHTML = RosterCalendar.render(roster, current, { exportMode: true });
  document.body.appendChild(stage);
  try {
    const canvas = await html2canvas(stage, { scale: 2, backgroundColor: '#ffffff', windowWidth: PNG_WIDTH });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const name = `roster-${current}-slt.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      showImage(blob, file);   // phone: share needs a fresh tap, so offer it from a viewer
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
  } catch (err) {
    if (err.name !== 'AbortError') alert(`Could not create the image: ${err.message}`);
  } finally {
    stage.remove();
    btn.disabled = false;
    btn.textContent = 'Download PNG';
  }
}

function showImage(blob, file) {
  const viewer = document.getElementById('pngViewer');
  const url = URL.createObjectURL(blob);
  viewer.querySelector('img').src = url;
  viewer.querySelector('#pngShare').onclick = () => navigator.share({ files: [file], title: file.name }).catch(() => {});
  viewer.querySelector('#pngClose').onclick = () => { viewer.style.display = 'none'; URL.revokeObjectURL(url); };
  viewer.style.display = 'flex';
}

async function init() {
  const el = document.getElementById('calendar');
  const passcode = getPasscode();
  try {
    const res = await fetch(`${SUPABASE_FN}/active-roster`, { headers: passcode ? { Authorization: `Bearer ${passcode}` } : {} });
    if (res.status === 401) {
      el.innerHTML = '<div class="msg err">Passcode required — open the <a href="index.html">briefing page</a> and unlock it on this device first.</div>';
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    roster = await res.json();
  } catch (err) {
    el.innerHTML = `<div class="msg err">Could not load the roster (${err.message}).</div>`;
    return;
  }
  const keys = RosterCalendar.monthKeys(roster);
  if (!keys.length) { el.innerHTML = '<div class="msg">No roster loaded — <a href="upload.html">upload a roster</a>.</div>'; return; }
  const now = new Date(), thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const requested = new URLSearchParams(location.search).get('month');
  show(keys.includes(requested) ? requested : keys.includes(thisMonth) ? thisMonth : (keys.find(k => k > thisMonth) || keys[keys.length - 1]));
}
init();
</script>
</body>
</html>
